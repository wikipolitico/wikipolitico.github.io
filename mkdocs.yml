site_name: Wiki Político
site_url: https://wikipolitico.github.io/
site_description: Acervo colaborativo sobre política nacional e internacional.
repo_url: https://github.com/wikipolitico/wikipolitico.github.io
repo_name: wikipolitico/wikipolitico.github.io
edit_uri: edit/main/docs/
copyright: "Contatos: contato.wikipolitico@gmail.com"

extra:
  analytics:
    provider: custom
    property: wikipolitico
    feedback:
      title: Esta página foi útil?
      ratings:
        - icon: material/thumb-up-outline
          name: Sim, foi útil
          data: 1
          note: >-
            Obrigado! Compartilhe com quem precisa desses argumentos.
        - icon: material/thumb-down-outline
          name: Não foi útil
          data: 0
          note: >-
            Obrigado pelo retorno!
            <a href="mailto:contato.wikipolitico@gmail.com?subject=Sugest%C3%A3o%20para%20a%20p%C3%A1gina%20{title}&body=P%C3%A1gina%3A%20https%3A%2F%2Fwikipolitico.github.io{url}">Conte o que faltou</a>.

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  logo: assets/logo-wikipolitico.png
  favicon: assets/logo-wikipolitico.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/weather-night
        name: Mudar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Mudar para o modo claro
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
    - content.action.edit

plugins:
  - search:
      lang: pt

hooks:
  - hooks/ultimas_atualizacoes.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Temas:
      - "Petrobrás": temas/petrobras.md
      - "Capitalismo": temas/capitalismo.md
      - "Comunismo e Socialismo": temas/comunismo-e-socialismo.md
      - "Corrupção": temas/corrupcao.md
      - "Caso Banco Master": temas/banco-master.md
      - "Caso Lulinha": temas/caso-lulinha.md
      - "STF":
          - "Visão geral": temas/stf.md
          - "André Mendonça": temas/stf/andre-mendonca.md
      - "Ditadura Militar de 64": temas/ditadura-militar-de-64.md
      - "Internacional / Geopolítica": temas/internacional-geopolitica.md
      - "Teorias Conspiratórias": temas/teorias-conspiratorias.md
      - "Mídia": temas/midia.md
      - "Violência / Fascismo / Preconceito": temas/violencia-fascismo-preconceito.md
      - "Partidos Políticos": temas/partidos-politicos.md
      - "Outras Personalidades (Brasil)": temas/outras-personalidades-brasil.md
      - "Políticas Públicas": temas/politicas-publicas.md
      - "Movimentos Políticos e Ativistas": temas/movimentos-politicos-e-ativistas.md
      - "Eleições 2018": temas/eleicoes-2018.md
      - "Eleições 2026": temas/eleicoes-2026.md
      - "CPMI das Fake News (2020)": temas/cpmi-das-fake-news-2020.md
      - "Outros / Não classificados": temas/outros-nao-classificados.md
  - "Mídias Alternativas": midias-alternativas.md
  - "Comparação FHC x Lula e Dilma": comparacao-fhc-lula-dilma.md
  - "Comparação Bolsonaro x Lula 3": comparacao-bolsonaro-lula3.md
  - "Transcrições e Grampos Telefônicos": transcricoes.md
  - "Frases e Pensamentos": frases-e-pensamentos.md
