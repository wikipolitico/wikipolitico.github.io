name: Verificar links

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # a lista consolidada e o .lycheeignore são gerados a partir dos avisos
      # das páginas; se alguém editar um aviso sem regerar, o gate acusa aqui
      - name: Conferir a lista de links fora do ar
        run: python3 manutencao/gerar_links_fora_do_ar.py --conferir

      # perfis de rede que o lychee não alcança, cada um pelo método que
      # funciona nele; não derruba o job, serve de relatório
      - name: Conferir perfis de rede social
        run: python3 manutencao/conferir_redes.py --quieto
        continue-on-error: true

      - uses: lycheeverse/lychee-action@v2
        with:
          # redes sociais exigem login e sempre aparecem como falha
          args: >-
            --no-progress
            --max-concurrency 16
            --timeout 30
            --accept "200..=299,403,429"
            --exclude "facebook\.com"
            --exclude "twitter\.com"
            --exclude "x\.com"
            --exclude "instagram\.com"
            "docs/**/*.md"
          fail: false
          jobSummary: true
